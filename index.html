<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voucher</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  .voucher-card {
    background: #fff;
    border-radius: 16px;
    max-width: 400px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .voucher-card img { width: 100%; display: block; }
  .error { color: #dc2626; padding: 40px; font-size: 16px; text-align: center; }
</style>
</head>
<body>
  <div id="app" class="voucher-card"></div>

  <script>
    const vouchers = {
      "1": { image: "voucher1.png" },
      "2": { image: "voucher2.png" }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const voucher = vouchers[id];

    const app = document.getElementById("app");

    if (voucher) {
      app.innerHTML = `<img src="${voucher.image}" alt="Voucher">`;
    } else {
      app.innerHTML = `<div class="error">Invalid or missing voucher ID.</div>`;
    }
  </script>
</body>
</html>
